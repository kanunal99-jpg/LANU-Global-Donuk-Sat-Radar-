name: LANU Live Cloud E2E

on:
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  id-token: write

jobs:
  live-cloud-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Run live Supabase acceptance
        run: |
          set -euo pipefail
          python3 scripts/live_cloud_e2e.py

      - name: Upload cloud acceptance evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: lanu-live-cloud-e2e-${{ github.run_id }}
          path: cloud-e2e-result.txt
          if-no-files-found: ignore
