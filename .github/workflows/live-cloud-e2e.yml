name: LANU Live Cloud E2E

on:
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  live-cloud-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Run live Supabase acceptance
        env:
          LANU_COMMIT_MESSAGE: ${{ github.event.pull_request.title }} ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          export LANU_COMMIT_MESSAGE="$(git log -1 --pretty=%B)"
          python3 scripts/live_cloud_e2e.py

      - name: Upload cloud acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lanu-live-cloud-e2e-${{ github.run_id }}
          path: cloud-e2e-result.txt
          if-no-files-found: ignore
