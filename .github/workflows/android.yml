name: Android CI

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Run lint
        run: timeout 180s gradle lint --no-daemon --stacktrace
      - name: Run unit tests
        run: timeout 240s gradle test --no-daemon --stacktrace
      - name: Inspect Android test runtime classpath
        run: |
          timeout 90s gradle :app:dependencies --configuration debugAndroidTestRuntimeClasspath --no-daemon > /tmp/android-test-runtime.txt
          grep -E "androidx.test|junit:junit|espresso" /tmp/android-test-runtime.txt | tail -n 160 || true

      - name: Build debug APK
        run: timeout 240s gradle assembleDebug --no-daemon --stacktrace
      - name: Enable KVM for Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Prepare deterministic Android emulator image
        timeout-minutes: 7
        run: |
          set -euo pipefail
          export ANDROID_SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME}}"
          export PATH="${ANDROID_SDK_ROOT}/emulator:${ANDROID_SDK_ROOT}/platform-tools:${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin:${PATH}"
          command -v adb
          command -v emulator
          command -v sdkmanager
          command -v avdmanager
          mkdir -p /tmp/lanu-ci
          echo "===== ANDROID SDK ====="
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT}"
          sdkmanager --list_installed | grep -E "platform-tools|emulator|system-images;android-35;google_apis;x86_64|platforms;android-35" || true
          yes | sdkmanager --licenses >/tmp/lanu-ci/licenses.log 2>&1 || true
          if [ ! -d "${ANDROID_SDK_ROOT}/system-images/android-35/google_apis/x86_64" ]; then
            timeout 300s sdkmanager "platform-tools" "emulator" "platforms;android-35" "system-images;android-35;google_apis;x86_64"
          fi
          echo "===== INSTALLED AFTER PREP ====="
          sdkmanager --list_installed | grep -E "platform-tools|emulator|system-images;android-35;google_apis;x86_64|platforms;android-35" || true
          echo "no" | avdmanager create avd -n "lanu-api35" -k "system-images;android-35;google_apis;x86_64" -d "pixel_2" --force

      - name: Boot deterministic Android emulator
        timeout-minutes: 7
        run: |
          set -u
          export ANDROID_SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME}}"
          export PATH="${ANDROID_SDK_ROOT}/emulator:${ANDROID_SDK_ROOT}/platform-tools:${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin:${PATH}"
          mkdir -p /tmp/lanu-ci
          adb start-server
          emulator -avd "lanu-api35" -port 5554 -no-window -noaudio -no-boot-anim -no-snapshot -wipe-data -gpu swiftshader_indirect -camera-back none -camera-front none >/tmp/lanu-ci/emulator.log 2>&1 &
          echo $! >/tmp/lanu-ci/emulator.pid
          status=0
          timeout 300s adb -s emulator-5554 wait-for-device || status=$?
          if [ "$status" -eq 0 ]; then
            timeout 300s bash -c 'until [ "$(adb -s emulator-5554 shell getprop sys.boot_completed 2>/dev/null | tr -d "\r")" = "1" ]; do sleep 2; done' || status=$?
          fi
          if [ "$status" -ne 0 ]; then
            echo "===== EMULATOR BOOT FAILURE ====="
            adb devices -l || true
            cat /tmp/lanu-ci/emulator.log || true
            adb -s emulator-5554 shell getprop 2>/dev/null | tail -n 80 || true
            exit "$status"
          fi
          adb -s emulator-5554 shell settings put global window_animation_scale 0 || true
          adb -s emulator-5554 shell settings put global transition_animation_scale 0 || true
          adb -s emulator-5554 shell settings put global animator_duration_scale 0 || true

      - name: Android emulator smoke tests
        timeout-minutes: 7
        run: |
          set -u
          mkdir -p /tmp/lanu-ci
          set +e
          timeout 300s gradle connectedDebugAndroidTest --no-daemon --stacktrace
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            echo "===== ADB/JUNIT DIAGNOSTICS ====="
            adb devices -l || true
            adb -s emulator-5554 shell getprop ro.build.version.release || true
            adb -s emulator-5554 shell getprop ro.build.version.sdk || true
            adb -s emulator-5554 logcat -d -v threadtime | grep -E "AndroidJUnit4|AndroidJUnitRunner|initializationError|NoClassDefFoundError|ClassNotFoundException|NoSuchMethodError|IncompatibleClassChangeError|VerifyError|StackOverflowError|FATAL EXCEPTION" | tail -n 500 || true
            cat /tmp/lanu-ci/emulator.log || true
            exit "$status"
          fi

      - name: Stop Android emulator
        if: always()
        run: |
          adb -s emulator-5554 emu kill || true
          if [ -f /tmp/lanu-ci/emulator.pid ]; then
            kill "$(cat /tmp/lanu-ci/emulator.pid)" 2>/dev/null || true
          fi
      - name: Prepare release filenames
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk Lanu-Global-Donuk-Satis-Radari-latest.apk
          sha256sum Lanu-Global-Donuk-Satis-Radari-latest.apk > Lanu-Global-Donuk-Satis-Radari-latest.apk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: lanu-global-donuk-satis-radari-debug
          path: |
            Lanu-Global-Donuk-Satis-Radari-latest.apk
            Lanu-Global-Donuk-Satis-Radari-latest.apk.sha256
      - name: Publish latest successful APK
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          APK_PATH: Lanu-Global-Donuk-Satis-Radari-latest.apk
          SHA_PATH: Lanu-Global-Donuk-Satis-Radari-latest.apk.sha256
        run: |
          set -euo pipefail
          gh release view latest --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create latest \
              --repo "$GITHUB_REPOSITORY" \
              --title "Latest APK" \
              --notes "Automatically published from the latest successful main CI build. Commit: $GITHUB_SHA" \
              --target "$GITHUB_SHA"

          gh release edit latest \
            --repo "$GITHUB_REPOSITORY" \
            --title "Latest APK" \
            --notes "Automatically published from the latest successful main CI build. Commit: $GITHUB_SHA" \
            --target "$GITHUB_SHA"

          for asset in app-debug.apk app-debug.apk.sha256 "$APK_PATH" "$SHA_PATH"; do
            gh release delete-asset latest "$asset" \
              --repo "$GITHUB_REPOSITORY" --yes >/dev/null 2>&1 || true
          done

          gh release upload latest \
            --repo "$GITHUB_REPOSITORY" \
            --clobber \
            "$APK_PATH" \
            "$SHA_PATH"
