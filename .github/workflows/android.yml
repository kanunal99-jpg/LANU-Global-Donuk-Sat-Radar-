name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: gradle assembleDebug
      - name: Calculate APK SHA-256
        run: sha256sum app/build/outputs/apk/debug/app-debug.apk > app-debug.apk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: lanu-global-donuk-satis-radari-debug
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app-debug.apk.sha256
      - name: Publish latest successful APK
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          APK_PATH: app/build/outputs/apk/debug/app-debug.apk
          SHA_PATH: app-debug.apk.sha256
        run: |
          set -euo pipefail
          gh release view latest --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create latest \
              --repo "$GITHUB_REPOSITORY" \
              --title "Latest APK" \
              --notes "Automatically published from the latest successful main CI build. Commit: $GITHUB_SHA" \
              --target "$GITHUB_SHA"

          gh release edit latest \
            --repo "$GITHUB_REPOSITORY" \
            --title "Latest APK" \
            --notes "Automatically published from the latest successful main CI build. Commit: $GITHUB_SHA" \
            --target "$GITHUB_SHA"

          gh release delete-asset latest app-debug.apk \
            --repo "$GITHUB_REPOSITORY" --yes || true
          gh release delete-asset latest app-debug.apk.sha256 \
            --repo "$GITHUB_REPOSITORY" --yes || true
          gh release delete-asset latest Lanu-Global-Donuk-Satis-Radari-latest.apk \
            --repo "$GITHUB_REPOSITORY" --yes || true
          gh release delete-asset latest Lanu-Global-Donuk-Satis-Radari-latest.apk.sha256 \
            --repo "$GITHUB_REPOSITORY" --yes || true

          gh release upload latest \
            --repo "$GITHUB_REPOSITORY" \
            "$APK_PATH#Lanu-Global-Donuk-Satis-Radari-latest.apk" \
            "$SHA_PATH#Lanu-Global-Donuk-Satis-Radari-latest.apk.sha256"