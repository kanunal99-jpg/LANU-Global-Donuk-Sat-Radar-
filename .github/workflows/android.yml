name: Android CI

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    timeout-minutes: 25
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Run lint
        run: timeout 180s gradle lint --no-daemon --stacktrace
      - name: Run unit tests
        run: timeout 240s gradle test --no-daemon --stacktrace
      - name: Inspect Android test runtime classpath
        run: |
          timeout 90s gradle :app:dependencies --configuration debugAndroidTestRuntimeClasspath --no-daemon > /tmp/android-test-runtime.txt
          grep -E "androidx.test|junit:junit|espresso" /tmp/android-test-runtime.txt | tail -n 160 || true

      - name: Build debug APK
        run: timeout 240s gradle assembleDebug --no-daemon --stacktrace
      - name: Enable KVM for Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install Android emulator system image
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT}}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          AVDMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/avdmanager"
          test -x "$SDKMANAGER"
          test -x "$AVDMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-35" \
            "system-images;android-35;google_apis;x86_64"

      - name: Android emulator smoke tests
        timeout-minutes: 12
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT}}"
          export PATH="$SDK_ROOT/platform-tools:$SDK_ROOT/emulator:$SDK_ROOT/cmdline-tools/latest/bin:$PATH"
          export ANDROID_HOME="$SDK_ROOT"
          echo "no" | avdmanager create avd \
            --name ci-api35 \
            --package "system-images;android-35;google_apis;x86_64" \
            --device "pixel_2" \
            --force

          rm -f /tmp/emulator.log
          emulator -avd ci-api35 \
            -no-window \
            -no-audio \
            -no-boot-anim \
            -no-snapshot \
            -no-snapshot-save \
            -gpu swiftshader_indirect \
            -accel on \
            -camera-back none \
            -camera-front none \
            -verbose \
            > /tmp/emulator.log 2>&1 &
          EMULATOR_PID="$!"

          cleanup() {
            adb emu kill >/dev/null 2>&1 || true
            kill "$EMULATOR_PID" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          echo "===== EMULATOR PROCESS CHECK ====="
          sleep 5
          if ! kill -0 "$EMULATOR_PID" >/dev/null 2>&1; then
            cat /tmp/emulator.log || true
            exit 1
          fi

          adb kill-server >/dev/null 2>&1 || true
          adb start-server

          echo "===== ADB DEVICE WAIT ====="
          ADB_READY=1
          set +e
          timeout 120s bash -c '
            for _ in $(seq 1 120); do
              if adb devices | grep -Eq "^emulator-[0-9]+[[:space:]]+device$"; then
                exit 0
              fi
              sleep 1
            done
            exit 124
          '
          ADB_READY="$?"
          set -e

          if [ "$ADB_READY" -ne 0 ]; then
            echo "===== ADB STARTUP DIAGNOSTICS ====="
            adb devices -l || true
            echo "===== /dev/kvm ====="
            ls -l /dev/kvm || true
            echo "===== EMULATOR ACCELERATION ====="
            emulator -accel-check || true
            echo "===== AVD LIST ====="
            avdmanager list avd || true
            echo "===== EMULATOR LOG ====="
            tail -n 1200 /tmp/emulator.log || true
            exit "$ADB_READY"
          fi

          SERIAL="$(adb devices | awk '/^emulator-[0-9]+[[:space:]]+device$/{print $1; exit}')"
          test -n "$SERIAL"
          echo "Using emulator: $SERIAL"

          echo "===== ANDROID BOOT WAIT ====="
          boot_completed=""
          for _ in $(seq 1 180); do
            boot_completed="$(adb -s "$SERIAL" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)"
            [ "$boot_completed" = "1" ] && break
            sleep 2
          done

          if [ "$boot_completed" != "1" ]; then
            echo "===== BOOT DIAGNOSTICS ====="
            adb devices -l || true
            adb -s "$SERIAL" shell getprop ro.build.version.release || true
            adb -s "$SERIAL" shell getprop ro.build.version.sdk || true
            adb -s "$SERIAL" logcat -d -v threadtime | tail -n 1200 || true
            tail -n 1200 /tmp/emulator.log || true
            exit 1
          fi

          adb -s "$SERIAL" shell settings put global window_animation_scale 0
          adb -s "$SERIAL" shell settings put global transition_animation_scale 0
          adb -s "$SERIAL" shell settings put global animator_duration_scale 0
          adb -s "$SERIAL" shell input keyevent 82 || true

          set +e
          timeout 300s gradle connectedDebugAndroidTest --no-daemon --stacktrace
          TEST_EXIT="$?"
          set -e

          if [ "$TEST_EXIT" -ne 0 ]; then
            echo "===== ADB/JUNIT DIAGNOSTICS ====="
            adb devices -l || true
            adb -s "$SERIAL" shell getprop ro.build.version.release || true
            adb -s "$SERIAL" shell getprop ro.build.version.sdk || true
            adb -s "$SERIAL" logcat -d -v threadtime | \
              grep -E "AndroidJUnit4|AndroidJUnitRunner|initializationError|NoClassDefFoundError|ClassNotFoundException|NoSuchMethodError|IncompatibleClassChangeError|VerifyError|StackOverflowError|FATAL EXCEPTION|AssertionError|TimeoutException" | tail -n 800 || true
            echo "===== EMULATOR LOG ====="
            tail -n 800 /tmp/emulator.log || true
            exit "$TEST_EXIT"
          fi

      - name: Prepare release filenames
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk Lanu-Global-Donuk-Satis-Radari-latest.apk
          sha256sum Lanu-Global-Donuk-Satis-Radari-latest.apk > Lanu-Global-Donuk-Satis-Radari-latest.apk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: lanu-global-donuk-satis-radari-debug
          path: |
            Lanu-Global-Donuk-Satis-Radari-latest.apk
            Lanu-Global-Donuk-Satis-Radari-latest.apk.sha256
      - name: Publish latest successful APK
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          APK_PATH: Lanu-Global-Donuk-Satis-Radari-latest.apk
          SHA_PATH: Lanu-Global-Donuk-Satis-Radari-latest.apk.sha256
        run: |
          set -euo pipefail
          gh release view latest --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create latest \
              --repo "$GITHUB_REPOSITORY" \
              --title "Latest APK" \
              --notes "Automatically published from the latest successful main CI build. Commit: $GITHUB_SHA" \
              --target "$GITHUB_SHA"

          gh release edit latest \
            --repo "$GITHUB_REPOSITORY" \
            --title "Latest APK" \
            --notes "Automatically published from the latest successful main CI build. Commit: $GITHUB_SHA" \
            --target "$GITHUB_SHA"

          for asset in app-debug.apk app-debug.apk.sha256 "$APK_PATH" "$SHA_PATH"; do
            gh release delete-asset latest "$asset" \
              --repo "$GITHUB_REPOSITORY" --yes >/dev/null 2>&1 || true
          done

          gh release upload latest \
            --repo "$GITHUB_REPOSITORY" \
            --clobber \
            "$APK_PATH" \
            "$SHA_PATH"
