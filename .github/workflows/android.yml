name: Android CI

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Run lint
        run: gradle lint
      - name: Run unit tests
        run: gradle test
      - name: Inspect Android test runtime classpath
        run: |
          gradle :app:dependencies --configuration debugAndroidTestRuntimeClasspath > /tmp/android-test-runtime.txt
          grep -E "androidx.test|junit:junit|espresso" /tmp/android-test-runtime.txt | tail -n 120 || true

      - name: Build debug APK
        run: gradle assembleDebug
      - name: Enable KVM for Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Android emulator smoke tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          ram-size: 2G
          disk-size: 8G
          force-avd-creation: true
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          disable-animations: true
          script: gradle connectedDebugAndroidTest --stacktrace
      - name: Prepare release filenames
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk Lanu-Global-Donuk-Satis-Radari-latest.apk
          sha256sum Lanu-Global-Donuk-Satis-Radari-latest.apk > Lanu-Global-Donuk-Satis-Radari-latest.apk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: lanu-global-donuk-satis-radari-debug
          path: |
            Lanu-Global-Donuk-Satis-Radari-latest.apk
            Lanu-Global-Donuk-Satis-Radari-latest.apk.sha256
      - name: Publish latest successful APK
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          APK_PATH: Lanu-Global-Donuk-Satis-Radari-latest.apk
          SHA_PATH: Lanu-Global-Donuk-Satis-Radari-latest.apk.sha256
        run: |
          set -euo pipefail
          gh release view latest --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create latest \
              --repo "$GITHUB_REPOSITORY" \
              --title "Latest APK" \
              --notes "Automatically published from the latest successful main CI build. Commit: $GITHUB_SHA" \
              --target "$GITHUB_SHA"

          gh release edit latest \
            --repo "$GITHUB_REPOSITORY" \
            --title "Latest APK" \
            --notes "Automatically published from the latest successful main CI build. Commit: $GITHUB_SHA" \
            --target "$GITHUB_SHA"

          for asset in app-debug.apk app-debug.apk.sha256 "$APK_PATH" "$SHA_PATH"; do
            gh release delete-asset latest "$asset" \
              --repo "$GITHUB_REPOSITORY" --yes >/dev/null 2>&1 || true
          done

          gh release upload latest \
            --repo "$GITHUB_REPOSITORY" \
            --clobber \
            "$APK_PATH" \
            "$SHA_PATH"
